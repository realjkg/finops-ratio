# .github/workflows/ci.yml
#
# CI pipeline for realjkg/token-sensei (Ratio v2)
# Target wall-clock: ≤3 min.
#
# Optimization strategy:
#   1. actions/setup-node cache:'npm'  → npm ci hits ~/.npm cache (saves ~55s)
#   2. actions/cache .next/cache       → next build reuses SWC artifacts (saves ~35s)
#   3. lint + typecheck + test in parallel → saves ~40s vs serial execution

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token scope (governance.yml pattern): read-only at the
# top level; no job in this workflow needs a write grant.
permissions:
  contents: read

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Ephemeral Postgres for the ingestion DB suite (*.db.test.ts). Trust auth
    # inside the job-scoped container only: no credential is stored anywhere.
    # Image from the ECR Public mirror of the same official library/postgres
    # image: GitHub-hosted runners repeatedly timed out pulling from
    # auth.docker.io (2026-10-09), and service containers pull before any step
    # can retry. Swap back once Docker Hub egress is stable.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # cache: 'npm' stores ~/.npm between runs.
      # On a cache hit, npm ci reads from local archive rather than the network.
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      # Slice 2b: the independent control-total calculator
      # (scripts/acceptance/focus_control_totals.py, stdlib only) runs in
      # `npm test` (P2) and in local:acceptance. Pinned interpreter. Without
      # python3 those tests FAIL, never skip.
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Python version check (>= 3.10)
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 10), "python3 >= 3.10 is required"'

      - name: Install dependencies
        run: npm ci

      # Key on lockfile hash + source hash so the cache busts when
      # deps or source files change. Restore-keys allow partial hits.
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      # Run lint, typecheck, and test concurrently. All three are fully
      # independent. Wall-clock is gated by the slowest leg (~40s typecheck).
      # `wait` propagates any non-zero exit code so CI fails on any error.
      - name: Lint · Typecheck · Test (parallel)
        run: |
          npm run lint      & PID_LINT=$!
          npm run typecheck & PID_TYPE=$!
          npm run test      & PID_TEST=$!
          wait $PID_LINT && wait $PID_TYPE && wait $PID_TEST

      # S3-compatible store for the ingestion worker's S3 tests (Slice 1).
      # Started as a step because service containers cannot take a command.
      # Image pinned by digest; throwaway, job-scoped, any key pair accepted.
      - name: Start SeaweedFS (S3-compatible, job-scoped)
        run: |
          # Pull with retries: runner egress to Docker Hub is flaky
          # (2026-10-09). Same digest as before; job-scoped, any key pair
          # accepted.
          for i in 1 2 3; do
            docker pull chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d && break
            if [ "$i" -ge 3 ]; then exit 1; fi
            sleep 15
          done
          docker run -d --name ratio-s3 -p 8333:8333 \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -dir=/data
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8333/ && exit 0
            sleep 2
          done
          docker logs ratio-s3; exit 1

      # PostgreSQL 16 client tools for the pg_dump -> restore round-trip test
      # (foundation.db.test.ts). Pinned by path; installed if the runner image
      # lacks them. The test itself fails (never skips) if they are missing or
      # not version 16.
      - name: PostgreSQL 16 client tools
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/16/bin/psql ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/psql --version

      # DB integration suite. `npm run test:db` FAILS (never skips) if the
      # URL is missing, so this step cannot go green without running. The S3
      # tests likewise fail (never skip) without RATIO_TEST_S3_ENDPOINT, and the
      # pg_dump round-trip fails (never skips) without PG16 RATIO_PG_DUMP/RATIO_PSQL.
      - name: DB tests (Postgres 16 + S3)
        env:
          RATIO_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          RATIO_TEST_S3_ENDPOINT: http://localhost:8333
          RATIO_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
          RATIO_PSQL: /usr/lib/postgresql/16/bin/psql
        run: npm run test:db

      # Production worker build + migration up/status/down/up smoke test on a
      # scratch database (down is allowed here only because this is CI).
      - name: Worker build + migration smoke
        env:
          RATIO_MIGRATE_DATABASE_URL: postgres://postgres@localhost:5432/ratio_ci_migrate
        run: |
          psql postgres://postgres@localhost:5432/postgres -c 'CREATE DATABASE ratio_ci_migrate'
          npm run worker:build
          npm run -s worker -- migrate
          npm run -s worker -- migrate --status --json
          RATIO_ENV=ci RATIO_ALLOW_DOWN_MIGRATIONS=1 npm run -s worker -- migrate --down 1
          npm run -s worker -- migrate
          npm run -s worker -- migrate --status --json

      # Build runs after validation so a type/lint failure short-circuits
      # before the more expensive build step.
      - name: Build
        run: npm run build

      # Slice 2: no driver/ingestion code in the client bundle; reader DB code
      # only in the costs route's own server chunks (scripts/check-next-bundle.mjs).
      - name: Bundle check
        run: npm run check:bundle

      # Slice 2: the local stack end to end under a real `next start`
      # (docker compose, PG16 + SeaweedFS pinned by digest on 127.0.0.1:54339 /
      # 18353, next start on 3110; its own project ratio-local-test, separate from
      # the job's services; scripts/local/lib.mjs localTestSettings): up -> migrate -> seed -> sync
      # -> GET /api/v1/costs/published. Reader totals must equal the fixture's
      # control totals exactly. Always torn down with `down -v`.
      - name: Local stack end to end (local:test)
        run: npm run local:test

      # Slice 2b: acceptance run on the public FOCUS 1.0 Sample Data (FinOps
      # Foundation, CC BY 4.0; fixtures/focus-1.0-sample/NOTICE.md). The committed
      # 1k file (SHA-256 pinned, no network) is staged as an AWS Data Exports
      # layout, synced twice by the real worker CLI, and read back through the
      # real route under next start. Totals per period and currency, the row
      # count, and the row sums and digests must equal control totals computed
      # independently in Python (the 3.12 pinned by "Setup Python 3.12" above).
      # Every API row must also equal its upstream record, field by field
      # (keyed by Id; DESIGN §5). Its
      # own project ratio-local-acceptance on 127.0.0.1:54349 / 18363 / 3120
      # (scripts/local/acceptance.mjs localAcceptanceSettings). Always torn
      # down with `down -v`. The 10k file is run on demand (DESIGN §7).
      - name: Acceptance run on the FOCUS 1.0 sample data (local:acceptance, 1k)
        run: npm run local:acceptance

