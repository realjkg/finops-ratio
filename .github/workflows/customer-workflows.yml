name: Customer and Frank acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-workflows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run simulation:test
      - name: Retain failures and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-workflow-evidence
          path: .simulation-test-results/
          retention-days: 7
