# docker-compose.local.yml — the LOCAL, EPHEMERAL Ratio stack (Slice 2).
# NOT a production artefact: the production hosting plan is in the Decision
# log of docs/evidence/slice-2/DEPLOYMENT_BRIEF.md (provisioning and spend are
# owner actions). Drive it with the npm scripts (they always pass -p <project>;
# `name:` below is only the default):
#   npm run local:up | local:migrate | local:seed | local:sync | local:down [-- -v] | local:test
# They generate the secrets below into .ratio-local/<project>/env (gitignored) and pass
# them in; running `docker compose` by hand without them fails fast.
#
# - Every port is published on 127.0.0.1 only.
# - Images are pinned by digest: Postgres 16 (major version pinned, D-08) and
#   the SeaweedFS build CI already uses for the S3 tests.
# - Postgres uses password auth (scram); no login is passwordless. Roles and logins are
#   created by scripts/local/bootstrap.mjs (Slice 0 privilege model).
# - SeaweedFS runs with its default config (no S3 identities: any key pair is
#   accepted) — acceptable only because it is loopback-only and throwaway.
# - `app` and `worker` are optional profiles. They mount the repo read-only and
#   need `npm ci`, `npm run build` and `npm run worker:build` on the host first.
#   The worker is a one-shot job (restart "no"), never a daemon.
name: ratio-local

services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${RATIO_LOCAL_PG_SUPERUSER_PASSWORD:?run npm run local:up (it generates .ratio-local/<project>/env)}"
    ports:
      - "127.0.0.1:${RATIO_LOCAL_PG_PORT:-54329}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: the image's init phase listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 5s
      retries: 60

  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # The default volume.max (8) cannot grow a second bucket (7 volumes per
    # bucket on first write): small sparse volumes and more slots instead.
    command: ["server", "-s3", "-dir=/data", "-volume.max=64", "-master.volumeSizeLimitMB=64"]
    ports:
      - "127.0.0.1:${RATIO_LOCAL_S3_PORT:-18343}:8333"
    volumes:
      - s3-data:/data

  app:
    profiles: ["app"]
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    working_dir: /app
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NODE_ENV: production
      RATIO_API_TOKEN: "${RATIO_LOCAL_API_TOKEN:-}"
      RATIO_API_TENANT_ID: "${RATIO_LOCAL_TENANT_ID:-}"
      RATIO_READER_DATABASE_URL: "postgres://ratio_local_reader:${RATIO_LOCAL_READER_PASSWORD:-}@postgres:5432/ratio"
    ports:
      - "127.0.0.1:${RATIO_LOCAL_APP_PORT:-3100}:3000"
    volumes:
      - .:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    restart: "no"
    working_dir: /app
    command: ["node", "dist-worker/ingest/cli.js", "sync", "--tenant", "${RATIO_LOCAL_TENANT_ID:-}", "--source", "local-focus"]
    environment:
      RATIO_ENV: development
      RATIO_DATABASE_URL: "postgres://ratio_local_worker:${RATIO_LOCAL_WORKER_PASSWORD:-}@postgres:5432/ratio"
      RATIO_SOURCE_S3_ENDPOINT: http://s3:8333
      RATIO_SOURCE_S3_REGION: us-east-1
      RATIO_SOURCE_S3_FORCE_PATH_STYLE: "1"
      RATIO_SOURCE_S3_ACCESS_KEY_ID: "${RATIO_LOCAL_S3_ACCESS_KEY_ID:-}"
      RATIO_SOURCE_S3_SECRET_ACCESS_KEY: "${RATIO_LOCAL_S3_SECRET_ACCESS_KEY:-}"
      RATIO_EVIDENCE_S3_ENDPOINT: http://s3:8333
      RATIO_EVIDENCE_S3_REGION: us-east-1
      RATIO_EVIDENCE_S3_BUCKET: ratio-local-evidence
      RATIO_EVIDENCE_S3_ACCESS_KEY_ID: "${RATIO_LOCAL_S3_ACCESS_KEY_ID:-}"
      RATIO_EVIDENCE_S3_SECRET_ACCESS_KEY: "${RATIO_LOCAL_S3_SECRET_ACCESS_KEY:-}"
    volumes:
      - .:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  pg-data:
  s3-data:
